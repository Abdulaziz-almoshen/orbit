<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Orbit protected sparse delivery graph</title>
  <desc id="desc">A goal sits at the center of a gear-scaled expert orbit. One Claude watchdog observes the complete descendant tree, while a trusted resource kernel meters every agent edge. Quality gates form a protected path to a proven commit.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="74%"><stop offset="0" stop-color="#14243a"/><stop offset=".55" stop-color="#09111d"/><stop offset="1" stop-color="#04070b"/></radialGradient>
    <linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#68e4ff"/><stop offset="1" stop-color="#4776ff"/></linearGradient>
    <linearGradient id="amber" x1="0" x2="1"><stop stop-color="#ffd166"/><stop offset="1" stop-color="#ff7a3d"/></linearGradient>
    <linearGradient id="green" x1="0" x2="1"><stop stop-color="#63f3b0"/><stop offset="1" stop-color="#10a877"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#68e4ff"/></marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#edf5ff}.label{font-size:17px;font-weight:700}.small{font-size:13px;fill:#9eb0c7}.micro{font-size:11px;fill:#7890ad;letter-spacing:1.2px}.role{fill:#101c2b;stroke:#31506f;stroke-width:1.5}.gate{fill:#10261f;stroke:#28c98c;stroke-width:2}.edge{fill:none;stroke:#4776ff;stroke-width:2;opacity:.65;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" rx="30" fill="url(#bg)"/>
  <text x="70" y="72" font-size="18" font-weight="800" fill="#68e4ff" letter-spacing="3">ORBIT / GOVERNED DELIVERY</text>
  <text x="70" y="112" font-size="34" font-weight="800">The goal stays fixed. The execution graph earns every token.</text>

  <!-- one real observer, spanning the complete descendant tree -->
  <path d="M282 240 C430 148 1170 148 1318 240" fill="none" stroke="url(#amber)" stroke-width="3" stroke-dasharray="8 9"/>
  <rect x="606" y="142" width="388" height="74" rx="37" fill="#25180e" stroke="#ff9850" stroke-width="2.5" filter="url(#glow)"/>
  <circle cx="651" cy="179" r="19" fill="none" stroke="#ffd166" stroke-width="3"/><circle cx="651" cy="179" r="6" fill="#ffd166"/>
  <text x="686" y="174" class="micro" fill="#ffb365">ONE CLAUDE OBSERVER</text><text x="686" y="196" class="label">watches the whole descendant tree</text>

  <!-- sparse expert orbit -->
  <ellipse cx="800" cy="472" rx="550" ry="242" fill="none" stroke="#20364e" stroke-width="2"/>
  <ellipse cx="800" cy="472" rx="395" ry="166" fill="none" stroke="#254b68" stroke-width="1.5" stroke-dasharray="5 8"/>
  <path class="edge" d="M465 364 C548 286 659 279 722 349"/>
  <path class="edge" d="M878 349 C957 279 1083 300 1138 379"/>
  <path class="edge" d="M1180 453 C1192 535 1090 602 998 607"/>
  <path class="edge" d="M909 649 C833 708 714 704 645 648"/>
  <path class="edge" d="M553 607 C463 579 407 503 427 430"/>

  <!-- central immutable goal -->
  <circle cx="800" cy="472" r="118" fill="#0b1725" stroke="url(#cyan)" stroke-width="4" filter="url(#glow)"/>
  <circle cx="800" cy="472" r="91" fill="#0d1f32" stroke="#294663"/>
  <text x="800" y="435" text-anchor="middle" class="micro" fill="#68e4ff">IMMUTABLE</text>
  <text x="800" y="478" text-anchor="middle" font-size="34" font-weight="850">USER GOAL</text>
  <text x="800" y="510" text-anchor="middle" class="small">acceptance + memory</text>
  <text x="800" y="533" text-anchor="middle" class="small">survive every compaction</text>

  <!-- role nodes -->
  <g><rect class="role" x="315" y="332" width="172" height="66" rx="18"/><text x="401" y="360" text-anchor="middle" class="label">DISCOVER</text><text x="401" y="382" text-anchor="middle" class="small">BA · Market · Plan</text></g>
  <g><rect class="role" x="1086" y="354" width="190" height="66" rx="18"/><text x="1181" y="382" text-anchor="middle" class="label">DESIGN / BUILD</text><text x="1181" y="404" text-anchor="middle" class="small">only relevant owners</text></g>
  <g><rect class="gate" x="1094" y="526" width="184" height="68" rx="18"/><text x="1186" y="555" text-anchor="middle" class="label">SAFETY · REVIEW</text><text x="1186" y="578" text-anchor="middle" class="small">protected edge</text></g>
  <g><rect class="gate" x="880" y="622" width="190" height="68" rx="18"/><text x="975" y="651" text-anchor="middle" class="label">QA · PIXEL PROOF</text><text x="975" y="674" text-anchor="middle" class="small">dependencies + scenarios</text></g>
  <g><rect class="gate" x="530" y="620" width="190" height="68" rx="18"/><text x="625" y="649" text-anchor="middle" class="label">CPO ACCEPT</text><text x="625" y="672" text-anchor="middle" class="small">goal-bound verdict</text></g>
  <g><rect class="role" x="318" y="500" width="190" height="66" rx="18"/><text x="413" y="528" text-anchor="middle" class="label">COMMIT + REPORT</text><text x="413" y="550" text-anchor="middle" class="small">exact proven snapshot</text></g>

  <!-- gear legend -->
  <rect x="70" y="250" width="190" height="326" rx="22" fill="#0a121e" stroke="#263c55"/>
  <text x="98" y="288" class="micro" fill="#68e4ff">SPARSE BY GEAR</text>
  <text x="98" y="330" class="label">T1</text><text x="142" y="330" class="small">prove</text>
  <text x="98" y="372" class="label">T2</text><text x="142" y="372" class="small">+ veto · CPO</text>
  <text x="98" y="414" class="label">T3</text><text x="142" y="414" class="small">+ discovery</text>
  <text x="98" y="456" class="label">T4</text><text x="142" y="456" class="small">durable mission</text>
  <line x1="98" y1="483" x2="230" y2="483" stroke="#263c55"/>
  <text x="98" y="516" class="small">No “T100” escape.</text><text x="98" y="540" class="small">Higher labels clamp</text><text x="98" y="564" class="small">to the T4 ceiling.</text>

  <!-- trusted kernel -->
  <rect x="238" y="772" width="1124" height="82" rx="24" fill="#081a18" stroke="#21c58a" stroke-width="2"/>
  <text x="278" y="804" class="micro" fill="#63f3b0">TRUSTED RESOURCE KERNEL · ZERO MODEL CALLS</text>
  <text x="278" y="834" class="label">reserve before Agent  →  force measurable return  →  charge actual usage  →  protect closeout  →  checkpoint</text>
  <circle cx="1317" cy="813" r="20" fill="#0e382b" stroke="#63f3b0"/><path d="M1308 813l7 7 13-17" fill="none" stroke="#63f3b0" stroke-width="3"/>
</svg>
